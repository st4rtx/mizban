# nginx site for testabr.ai-synapse.ir. Installed as /etc/nginx/sites-available/mizban,
# enabled as zzz-mizban (loads after, and never touches, the other sites on this host).
# ArvanCloud terminates the public TLS; the origin uses the host's existing origin certificate.

map $http_upgrade $mizban_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name testabr.ai-synapse.ir;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { include /etc/nginx/mizban-proxy.inc; }
}

server {
    listen 443 ssl http2;
    server_name testabr.ai-synapse.ir;

    ssl_certificate     /etc/ssl/nobatban/nobatban.crt;
    ssl_certificate_key /etc/ssl/nobatban/nobatban.key;

    client_max_body_size 1m;

    # Server-Sent Events: never buffer, keep the connection open
    location = /api/events {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # overwrite, never append: the app must not believe a client-supplied X-Forwarded-For
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / { include /etc/nginx/mizban-proxy.inc; }
}
