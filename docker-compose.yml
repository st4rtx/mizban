# Local + production stack. `make up` for dev DB only; `docker compose up -d` for the full app.
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: mizban
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD}
      POSTGRES_DB: mizban
    # small shared hosts: keep Postgres modest
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=40", "-c", "work_mem=4MB"]
    volumes:
      - mizban-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5455}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizban -d mizban"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  app:
    image: ${APP_IMAGE:-mizban-app:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://mizban_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/mizban
      DATABASE_ADMIN_URL: postgres://mizban:${DB_ADMIN_PASSWORD}@db:5432/mizban
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DEMO_MODE: ${DEMO_MODE:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.gapgpt.app/v1}
      AI_MODEL: ${AI_MODEL:-gapgpt-qwen-3.5}
      WEB_DIST: /app/web/dist
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    mem_limit: 320m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  mizban-pg:
